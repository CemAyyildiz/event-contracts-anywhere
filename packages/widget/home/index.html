<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Anywhere — DreamDEX Event Contracts in Telegram</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Syne:wght@700;800&family=IBM+Plex+Sans:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --bg0: #06080b;
        --bg1: #10151b;
        --text: #f1f3f5;
        --muted: #8b949e;
        --up: #2fd67b;
        --accent: #e6c35c;
        --line: rgba(255, 255, 255, 0.1);
      }
      * { box-sizing: border-box; }
      html, body { margin: 0; min-height: 100%; }
      body {
        font-family: "IBM Plex Sans", sans-serif;
        color: var(--text);
        background:
          radial-gradient(90% 60% at 15% -10%, rgba(47, 214, 123, 0.18), transparent 55%),
          radial-gradient(70% 50% at 100% 0%, rgba(230, 195, 92, 0.12), transparent 45%),
          linear-gradient(165deg, var(--bg1), var(--bg0));
      }
      .hero {
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        justify-content: flex-end;
        padding: clamp(1.5rem, 5vw, 3rem);
        max-width: 720px;
        margin: 0 auto;
        position: relative;
        overflow: hidden;
      }
      .hero::after {
        content: "";
        position: absolute;
        inset: 10% -20% auto auto;
        width: min(520px, 90vw);
        height: min(520px, 90vw);
        background:
          radial-gradient(circle at 40% 40%, rgba(47, 214, 123, 0.25), transparent 55%),
          radial-gradient(circle at 70% 60%, rgba(255, 92, 92, 0.18), transparent 50%);
        filter: blur(8px);
        pointer-events: none;
        animation: drift 12s ease-in-out infinite alternate;
      }
      @keyframes drift {
        from { transform: translate(-4%, 2%) scale(1); }
        to { transform: translate(3%, -3%) scale(1.06); }
      }
      .mark {
        font-family: "Syne", sans-serif;
        font-weight: 800;
        font-size: clamp(2.8rem, 12vw, 5.2rem);
        letter-spacing: -0.04em;
        line-height: 0.92;
        margin: 0 0 1rem;
        position: relative;
        z-index: 1;
        animation: rise 700ms cubic-bezier(0.22, 1, 0.36, 1) both;
      }
      .mark span { color: var(--up); }
      h1 {
        position: relative;
        z-index: 1;
        font-family: "Syne", sans-serif;
        font-size: clamp(1.25rem, 3.5vw, 1.75rem);
        font-weight: 700;
        line-height: 1.25;
        max-width: 18ch;
        margin: 0 0 0.75rem;
        animation: rise 700ms 80ms cubic-bezier(0.22, 1, 0.36, 1) both;
      }
      .sub {
        position: relative;
        z-index: 1;
        color: var(--muted);
        max-width: 34ch;
        margin: 0 0 1.75rem;
        font-size: 1.02rem;
        line-height: 1.45;
        animation: rise 700ms 140ms cubic-bezier(0.22, 1, 0.36, 1) both;
      }
      .ctas {
        position: relative;
        z-index: 1;
        display: flex;
        flex-wrap: wrap;
        gap: 0.65rem;
        animation: rise 700ms 200ms cubic-bezier(0.22, 1, 0.36, 1) both;
      }
      a.btn {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        padding: 0.9rem 1.2rem;
        border-radius: 12px;
        text-decoration: none;
        font-weight: 600;
        font-size: 0.95rem;
      }
      a.primary {
        background: linear-gradient(180deg, #3ae88a, var(--up));
        color: #04140c;
      }
      a.ghost {
        border: 1px solid var(--line);
        color: var(--text);
        background: rgba(255, 255, 255, 0.04);
      }
      .note {
        position: relative;
        z-index: 1;
        margin-top: 1.25rem;
        font-size: 0.75rem;
        color: var(--muted);
        animation: rise 700ms 260ms cubic-bezier(0.22, 1, 0.36, 1) both;
      }
      @keyframes rise {
        from { opacity: 0; transform: translateY(14px); }
        to { opacity: 1; transform: none; }
      }
    </style>
  </head>
  <body>
    <main class="hero">
      <p class="mark">Any<span>where</span></p>
      <h1>DreamDEX Event Contracts where people already are</h1>
      <p class="sub">
        Open in Telegram. Get a session wallet. Deposit. Trade Up/Down on Shannon —
        PnL settles to your address.
      </p>
      <div class="ctas">
        <a class="btn primary" href="/tma/">Open Mini App →</a>
        <a class="btn ghost" href="/?host=home&market=BTC">Trade in browser</a>
      </div>
      <p class="note">Somnia Shannon · live order book · keys on device</p>
    </main>
  </body>
</html>
